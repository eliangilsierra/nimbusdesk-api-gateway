server:
  port: 8080

spring:
  application:
    name: nimbusdesk-api-gateway
  cloud:
    gateway:
      routes:
        - id: identity-service
          uri: lb://nimbusdesk-identity-service
          predicates:
            - Path=/api/identity/**
          filters:
            - RewritePath=/api/identity/(?<segment>.*), /${segment}

        - id: booking-service
          uri: lb://nimbusdesk-booking-service
          predicates:
            - Path=/api/bookings/**
          filters:
            - RewritePath=/api/bookings/(?<segment>.*), /${segment}

        - id: partner-bridge-service
          uri: lb://nimbusdesk-partner-bridge-service
          predicates:
            - Path=/api/partner-bridge/**
          filters:
            - RewritePath=/api/partner-bridge/(?<segment>.*), /${segment}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}

nimbusdesk:
  security:
    jwt-secret: ${JWT_SECRET:nimbusdesk-dev-secret-change-me-nimbusdesk-dev-secret}
  public-endpoints:
    - /api/identity/auth/login
    - /api/identity/auth/register
    - /actuator/health

logging:
  level:
    org.springframework.cloud.gateway: INFO
